name: CI/CD Pipeline - ESGenergia DevOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Build e Testes Automatizados
        run: mvn clean test package

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy para Staging
        run: |
          echo "Iniciando deploy no ambiente de STAGING..."
          echo "Simulando atualização de containers..."
          echo "Deploy em Staging finalizado com sucesso!"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy para Produção
        run: |
          echo "Iniciando deploy no ambiente de PRODUÇÃO..."
          echo "Aplicando tags de release..."
          echo "Deploy em Produção finalizado com sucesso!"